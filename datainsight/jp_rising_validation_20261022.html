<script>
const headless=false;
const report=JSON.parse(document.getElementById('report-data').textContent),rows=report.rows;
const el=id=>document.getElementById(id),fmt=n=>Number(n).toLocaleString('en-US'),pct=n=>(n*100).toFixed(1)+'%';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=s=>{try{const u=new URL(s);return ['https:','http:'].includes(u.protocol)?esc(u.href):''}catch{return ''}};
const week=report.week_this_week||rows[0]?.week_this_week;
function prior(days){const d=new Date(week+'T00:00:00Z');d.setUTCDate(d.getUTCDate()-days);return d.toISOString().slice(0,10)}
const dates=[prior(14),prior(7),week];
if(!headless){
el('period').textContent=dates.join(' → ')+'｜日期為榜單週別標籤';
el('count').textContent=rows.length;el('bestGain').textContent=rows.length?Math.max(...rows.map(r=>r.total_rank_gain))+' 名':'—';el('bestGrowth').textContent=rows.length?pct(Math.max(...rows.map(r=>r.total_view_growth))):'—';
}
function chart(values,rank){const max=rank?100:Math.max(...values)*1.25;const y=v=>rank?40+(v-1)/99*90:130-v/max*100;const xs=[70,230,390];return `<svg class="chart" viewBox="0 0 460 170" role="img" aria-label="${rank?'排名':'週觀看數'}：${esc(values.join(' → '))}"><path d="M45 35V135H420" fill="none" stroke="#dce4de"/><text x="4" y="40">${rank?'1名':(max/1e6).toFixed(1)+'M'}</text><text x="4" y="135">${rank?'100名':'0'}</text><polyline points="${values.map((v,i)=>xs[i]+','+y(v)).join(' ')}" fill="none" stroke="${rank?'#167455':'#4b75aa'}" stroke-width="3"/>${values.map((v,i)=>`<circle cx="${xs[i]}" cy="${y(v)}" r="4" fill="${rank?'#167455':'#4b75aa'}"/><text class="value" x="${xs[i]}" y="${y(v)-12}" text-anchor="middle">${rank?'#'+v:(v/1e6).toFixed(2)+'M'}</text><text x="${xs[i]}" y="158" text-anchor="middle">${dates[i].slice(5)}</text>`).join('')}</svg>`}
function card(r,index){const ranks=[r.rank_two_weeks_ago,r.rank_last_week,r.rank_this_week],views=[r.views_two_weeks_ago,r.views_last_week,r.views_this_week];const url=safeUrl(r.youtube_url),thumb=safeUrl(r.thumbnailImage);return `<article class="card">${index<3?`<div class="medal" aria-label="第 ${index+1} 名">${['🥇','🥈','🥉'][index]} <span>TOP ${index+1}</span></div>`:''}<div class="song">${thumb?`<img class="art" src="${thumb}" alt="${esc(r.title)} 縮圖" loading="lazy" referrerpolicy="no-referrer">`:'<div class="art" aria-label="無縮圖"></div>'}<div><h2>${url?`<a href="${url}" target="_blank" rel="noopener noreferrer">${esc(r.title)} ↗</a>`:esc(r.title)}</h2><p>${esc(r.artists||'歌手資料未提供')}</p></div></div><div class="badges"><b>↑ ${r.total_rank_gain} 名</b><b>觀看數 +${pct(r.total_view_growth)}</b></div><div class="chart-label">名次走勢</div>${chart(ranks,true)}<div class="chart-label">週觀看數</div>${chart(views,false)}<table><thead><tr><th>週別</th><th>名次</th><th>觀看數</th></tr></thead><tbody>${dates.map((d,i)=>`<tr><td>${d}</td><td>${ranks[i]}</td><td>${fmt(views[i])}</td></tr>`).join('')}</tbody></table></article>`}
function render(){const q=el('search').value.toLocaleLowerCase();const list=rows.filter(r=>(r.title+' '+(r.artists||'')).toLocaleLowerCase().includes(q));const mode=el('sort').value;list.sort((a,b)=>mode==='rank'?a.rank_this_week-b.rank_this_week:mode==='growth'?b.total_view_growth-a.total_view_growth:b.total_rank_gain-a.total_rank_gain);el('cards').innerHTML=list.length?list.map(card).join(''):'<div class="empty">'+(rows.length?'沒有符合搜尋的歌曲。':'本週沒有符合條件的歌曲。')+'</div>';el('shown').textContent=`顯示 ${list.length} / ${rows.length} 首`;}
if(headless){el('cards').innerHTML=rows.length?rows.map(card).join(''):'<div class="empty">本週沒有符合條件的歌曲。</div>';}else{el('search').addEventListener('input',render);el('sort').addEventListener('change',render);render();}
</script></body></html>
